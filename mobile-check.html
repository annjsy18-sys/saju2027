<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="noindex, nofollow" name="robots"/>
<title>mobile check</title>
<style>
body{margin:0;background:#d9d4cc;font:12px/1.4 sans-serif}
.row{display:flex;gap:12px;padding:10px;align-items:flex-start}
.cell{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.cap{padding:4px 6px;font-weight:700;background:#222;color:#fff}
iframe{width:375px;height:800px;border:0;display:block;background:#fff}
#report{padding:8px 10px;font:12px/1.5 monospace;background:#111;color:#0f0;white-space:pre-wrap}
</style>
</head>
<body>
<div id="report">checking…</div>
<div class="row">
  <div class="cell"><div class="cap">1. index.html 상단</div><iframe id="f1" src="index.html" title="index top"></iframe></div>
  <div class="cell"><div class="cap">2. index.html 칼럼 섹션(#columns)</div><iframe id="f2" src="index.html#columns" title="index columns"></iframe></div>
  <div class="cell"><div class="cap">3. columns/index.html</div><iframe id="f3" src="columns/index.html" title="columns list"></iframe></div>
</div>
<div class="row">
  <div class="cell"><div class="cap">4. columns/2027-jeongmi-year.html</div><iframe id="f4" src="columns/2027-jeongmi-year.html" title="article"></iframe></div>
  <div class="cell"><div class="cap">5. columns/cheongan-jiji-basics.html</div><iframe id="f5" src="columns/cheongan-jiji-basics.html" title="article2"></iframe></div>
</div>
<script>
const lines = [];
function check(id, label){
  const f = document.getElementById(id);
  try{
    const d = f.contentDocument;
    const de = d.documentElement;
    const sw = Math.max(de.scrollWidth, d.body.scrollWidth);
    const cw = de.clientWidth;
    lines.push(label + ': viewport=' + cw + ' scrollWidth=' + sw + (sw > cw ? '  OVERFLOW +' + (sw - cw) : '  OK'));
    // 넘치는 요소 찾기
    if (sw > cw) {
      [...d.querySelectorAll('*')].forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.right > cw + 1 && r.width > 0) {
          lines.push('   > ' + el.tagName + '.' + (el.className || '') + ' right=' + Math.round(r.right) + ' w=' + Math.round(r.width));
        }
      });
    }
    // 상단 메뉴 줄바꿈 여부
    const nav = d.querySelector('.site-top nav');
    if (nav) {
      const a = [...nav.querySelectorAll('a')];
      const tops = new Set(a.map(x => Math.round(x.getBoundingClientRect().top)));
      lines.push('   nav links=' + a.length + ' rows=' + tops.size + ' texts=' + a.map(x => x.textContent.trim()).join('|'));
    }
    const h = d.querySelector('.site-top');
    if (h) lines.push('   header height=' + Math.round(h.getBoundingClientRect().height));
  }catch(e){ lines.push(label + ': ERR ' + e.message); }
}
const pairs = [['f1','1 index-top'],['f2','2 index-columns'],['f3','3 columns-list'],['f4','4 article-1'],['f5','5 article-2']];
window.addEventListener('load', () => {
  setTimeout(() => {
    pairs.forEach(([id,l]) => check(id,l));
    document.getElementById('report').textContent = lines.join('\n');
    window.__report = lines.join('\n');
  }, 2500);
});
</script>
</body>
</html>
