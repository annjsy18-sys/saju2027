<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>390px 미리보기 (임시)</title>
<style>
  html,body{margin:0;padding:0;background:#1d1917}
  .stage{display:flex;gap:18px;padding:14px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:6px}
  .cap{font:600 11px/1.4 system-ui,sans-serif;color:#b9a894;letter-spacing:.04em}
  iframe{width:390px;height:880px;border:0;background:#FAF7F2;display:block;border-radius:6px}
</style>
</head>
<body>
<div class="stage">
  <div class="col">
    <span class="cap">390 × 880 · Galaxy-class</span>
    <iframe id="m390" src="./index.html?v=4g" title="390px 미리보기"></iframe>
  </div>
</div>
<script>
  /* 미리보기 전용: 스크롤바를 숨겨 390px 화면을 그대로 캡처한다. (사이트 본문에는 영향 없음) */
  (function(){
    var f=document.getElementById('m390');
    function hide(){
      try{
        var d=f.contentDocument; if(!d) return;
        if(d.getElementById('pv-hide-sb')) return;
        var s=d.createElement('style'); s.id='pv-hide-sb';
        s.textContent='html{scrollbar-width:none!important}body::-webkit-scrollbar,html::-webkit-scrollbar{display:none!important;width:0!important}';
        (d.head||d.documentElement).appendChild(s);
      }catch(e){}
    }
    f.addEventListener('load',hide);
    setTimeout(hide,800);
  })();
</script>
</body>
</html>
